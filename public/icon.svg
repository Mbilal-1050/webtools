<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2563eb" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="128" fill="url(#brand-grad)" />
  <!-- Inner subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" />
  <!-- Central Icon Graphic (Wrench & Sparkle & Shield) -->
  <g filter="url(#glow)" transform="translate(106, 106) scale(0.5859375)">
    <!-- Shield / Vault Symbolizing Client-Side Privacy -->
    <path d="M256 32L80 96v144c0 142 75 220 176 256 101-36 176-114 176-256V96L256 32z" fill="#ffffff" fill-opacity="0.95" />
    <!-- Inner Tool / Bolt / Lightning Icon -->
    <path d="M272 128L192 272h64l-16 144 96-160h-64z" fill="#2563eb" />
  </g>
</svg>
